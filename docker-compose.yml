services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: facturacion
      POSTGRES_PASSWORD: facturacion
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    ports:
      - "8200:8000"
    environment:
      FACT_DATABASE_URL: postgresql+asyncpg://facturacion:facturacion@db:5432/facturacion
    depends_on:
      - db
    command: >
      sh -c "
        sleep 2 &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  pgdata:
